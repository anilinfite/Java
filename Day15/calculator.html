<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1d2a78, #120f2d 45%, #090916 100%);
    }

    .calculator {
      width: 380px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.4);
      padding: 22px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      color: #ffffff;
    }

    .logo {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      box-shadow: 0 10px 20px rgba(58,123,213,0.45);
      font-weight: 700;
      font-size: 18px;
    }

    .name {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #eaf7ff;
      text-align: center;
      flex: 1;
      margin: 0 10px;
    }

    .display {
      width: 100%;
      height: 75px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      font-size: 30px;
      text-align: right;
      padding: 10px 16px;
      background: rgba(10, 15, 30, 0.7);
      color: #ffffff;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.04);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 62px;
      font-size: 22px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      color: #ffffff;
      background: rgba(255,255,255,0.08);
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
      box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    }

    button:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.15);
    }

    .operator {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
    }

    .equal {
      background: linear-gradient(135deg, #10b981, #059669);
      grid-column: span 2;
    }

    .clear {
      background: linear-gradient(135deg, #f97316, #ef4444);
    }

    .delete {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="topbar">
      <div class="logo">A2</div>
      <div class="name">Anilkumar Biaradar</div>
    </div>
    <input class="display" id="display" type="text" readonly />

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="appendValue('/')" class="operator">/</button>
      <button onclick="appendValue('*')" class="operator">×</button>
      <button class="delete" onclick="deleteLast()">⌫</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendValue('-')" class="operator">−</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="appendValue('+')" class="operator">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('.')">.</button>

      <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
      <button onclick="calculate()" class="equal">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(value) {
      display.value += value;
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    function clearDisplay() {
      display.value = '';
    }

    function calculate() {
      try {
        display.value = Function('"use strict"; return (' + display.value + ')')();
      } catch {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
